name: Chaoxing App

on:
  push:
  pull_request:
    paths:
      - ".github/workflows/chaoxing-app.yml"
      - "apps/chaoxing_app/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chaoxing_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoxing-app-release-apk
          path: apps/chaoxing_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}-${{ github.sha }}
          name: Chaoxing App ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: apps/chaoxing_app/build/app/outputs/flutter-apk/app-release.apk

name: Chaoxing App

on:
  push:
    paths:
      - ".github/workflows/chaoxing-app.yml"
      - "apps/chaoxing_app/**"
  pull_request:
    paths:
      - ".github/workflows/chaoxing-app.yml"
      - "apps/chaoxing_app/**"
  workflow_dispatch:

concurrency:
  group: chaoxing-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-release:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chaoxing_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Android application entry point
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq '    namespace = "com.sein.chaoxingapp"' android/app/build.gradle.kts
          grep -Fxq '        applicationId = "com.sein.chaoxingapp"' android/app/build.gradle.kts
          grep -Fxq 'package com.sein.chaoxingapp' android/app/src/main/kotlin/com/sein/chaoxingapp/MainActivity.kt
          grep -Fq 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          if grep -Fq 'android:scheme="http"' android/app/src/main/AndroidManifest.xml; then
            echo 'Android manifest must not declare cleartext HTTP queries' >&2
            exit 1
          fi

      - name: Configure Android release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEY_PROPERTIES_BASE64:?Missing ANDROID_KEY_PROPERTIES_BASE64 secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          "$build_tools/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Audit APK contents
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          unzip -Z1 "$apk" > build/apk-contents.txt
          if grep -Eiq '(^|/)(\.dev\.vars|\.env([^/]*)?|test|tests|fixtures?|shared_preferences|flutter_secure_storage)(/|$)|\.(log|sqlite|sqlite3|db)$' build/apk-contents.txt; then
            echo "Forbidden development or runtime data found in APK:" >&2
            grep -Ei '(^|/)(\.dev\.vars|\.env([^/]*)?|test|tests|fixtures?|shared_preferences|flutter_secure_storage)(/|$)|\.(log|sqlite|sqlite3|db)$' build/apk-contents.txt >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: chaoxing-app-release-apk
          path: apps/chaoxing_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-release:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/chaoxing_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release --build-number ${{ github.run_number }}

      - name: Verify Windows single-instance activation
        shell: pwsh
        run: ./tool/verify_windows_single_instance.ps1

      - name: Audit Windows release contents
        shell: pwsh
        run: |
          $release = Resolve-Path "build/windows/x64/runner/Release"
          $forbidden = Get-ChildItem -LiteralPath $release -Recurse -Force | Where-Object {
            $_.Name -match '^\.dev\.vars$|^\.env(?:\..*)?$|^(?:test|tests|fixtures?)$|\.(?:log|sqlite|sqlite3|db)$' -or
            $_.FullName -match '[\\/](?:test|tests|fixtures?)[\\/]'
          }
          if ($forbidden) {
            Write-Error ("Forbidden development or runtime data found in Windows release:`n" + ($forbidden.FullName -join "`n"))
            exit 1
          }

      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "build/chaoxing-app-windows-x64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: chaoxing-app-windows-x64
          path: apps/chaoxing_app/build/chaoxing-app-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - android-release
      - windows-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -f app-release.apk
          test -f chaoxing-app-windows-x64.zip
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          test -s SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}-${{ github.sha }}
          name: Chaoxing App ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            ## 使用说明

            - Windows：解压 `chaoxing-app-windows-x64.zip` 后运行 `chaoxing_app.exe`。
            - Android：安装 `app-release.apk`。
            - 内部构建号：`${{ github.run_number }}`（Android versionCode / Windows build suffix）。
            - 完整性校验：使用 `SHA256SUMS` 核对 APK 和 Windows ZIP 的 SHA-256。
            - 学习通 Cookie 仅保存在设备安全存储中，并只发送到学习通可信域名。
            - Windows 客户端支持内置 WebView2 登录并自动导入 Cookie，也保留手动导入作为备用方式。

            ## 当前限制

            - 已使用真实学习通账号验证登录、Cookie 自动导入、收件箱与课程空间同步；学习通页面或接口变化后仍可能需要更新解析规则。
            - Windows 系统通知和托盘常驻已接入；通知肉眼可见性、点击行为和托盘菜单退出仍需按发布版本手动验收。
            - 课程空间补充同步默认开启，会补抓课程作业与考试；明确完成、已提交、过期和只读事项会被过滤，状态不明事项会保留以避免漏项。
            - App 退出后不提供 Windows Service 或系统计划任务式后台同步。
          files: release-assets/*

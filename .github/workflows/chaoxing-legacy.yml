name: Chaoxing Flutter (legacy reference)

on:
  push:
    paths:
      - ".github/workflows/chaoxing-legacy.yml"
      - "legacy/chaoxing_app/**"
  pull_request:
    paths:
      - ".github/workflows/chaoxing-legacy.yml"
      - "legacy/chaoxing_app/**"
  workflow_dispatch:

concurrency:
  group: chaoxing-legacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-reference:
    name: Analyze and test reference app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/chaoxing_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

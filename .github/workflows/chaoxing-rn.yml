name: Chaoxing production

on:
  push:
    paths:
      - ".github/workflows/chaoxing-rn.yml"
      - "packages/chaoxing-domain/**"
      - "packages/chaoxing-android-alarms/**"
      - "packages/chaoxing-android-http/**"
      - "apps/chaoxing_rn/**"
      - "apps/chaoxing_windows/**"
      - "docs/rn-production.md"
  pull_request:
    paths:
      - ".github/workflows/chaoxing-rn.yml"
      - "packages/chaoxing-domain/**"
      - "packages/chaoxing-android-alarms/**"
      - "packages/chaoxing-android-http/**"
      - "apps/chaoxing_rn/**"
      - "apps/chaoxing_windows/**"
      - "docs/rn-production.md"
  workflow_dispatch:

concurrency:
  group: chaoxing-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  domain-alarms-http-and-app:
    name: Domain + alarms + HTTP + RN Android
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/chaoxing-domain/package-lock.json
            packages/chaoxing-android-alarms/package-lock.json
            packages/chaoxing-android-http/package-lock.json
            apps/chaoxing_rn/package-lock.json

      - name: Install domain package
        working-directory: packages/chaoxing-domain
        run: npm ci

      - name: Typecheck domain package
        working-directory: packages/chaoxing-domain
        run: npm run typecheck

      - name: Test domain package
        working-directory: packages/chaoxing-domain
        run: npm test

      - name: Install Android alarms package
        working-directory: packages/chaoxing-android-alarms
        run: npm ci

      - name: Typecheck Android alarms package
        working-directory: packages/chaoxing-android-alarms
        run: npm run typecheck

      - name: Test Android alarms package
        working-directory: packages/chaoxing-android-alarms
        run: npm test

      - name: Install Android HTTP package
        working-directory: packages/chaoxing-android-http
        run: npm ci

      - name: Typecheck Android HTTP package
        working-directory: packages/chaoxing-android-http
        run: npm run typecheck

      - name: Test Android HTTP package
        working-directory: packages/chaoxing-android-http
        run: npm test

      - name: Install React Native app
        working-directory: apps/chaoxing_rn
        run: npm ci

      - name: Typecheck React Native app
        working-directory: apps/chaoxing_rn
        run: npm run typecheck

      - name: Test React Native Android app
        working-directory: apps/chaoxing_rn
        run: npm test

  android-assemble:
    name: Android unsigned assemble
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/chaoxing-domain/package-lock.json
            packages/chaoxing-android-alarms/package-lock.json
            packages/chaoxing-android-http/package-lock.json
            apps/chaoxing_rn/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install domain package
        working-directory: packages/chaoxing-domain
        run: npm ci

      - name: Install Android alarms package
        working-directory: packages/chaoxing-android-alarms
        run: npm ci

      - name: Install Android HTTP package
        working-directory: packages/chaoxing-android-http
        run: npm ci

      - name: Install React Native app
        working-directory: apps/chaoxing_rn
        run: npm ci

      - name: Assemble Android APK
        working-directory: apps/chaoxing_rn
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: bash tool/ci-android-assemble.sh

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: chaoxing-rn-android-apk
          path: |
            apps/chaoxing_rn/build/ci/app-debug.apk
            apps/chaoxing_rn/build/ci/app-release.apk
            apps/chaoxing_rn/build/ci/SIGNING.txt
          if-no-files-found: error

  windows-host:
    name: Windows host
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/chaoxing-domain/package-lock.json
            apps/chaoxing_windows/package-lock.json

      - name: Install domain package
        working-directory: packages/chaoxing-domain
        run: npm ci

      - name: Install Windows host
        working-directory: apps/chaoxing_windows
        run: npm ci

      - name: Typecheck Windows host
        working-directory: apps/chaoxing_windows
        run: npm run typecheck

      - name: Test Windows tray, autostart, due-now, installer
        working-directory: apps/chaoxing_windows
        run: npm test

  windows-native:
    name: Windows native + installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/chaoxing-domain/package-lock.json
            apps/chaoxing_windows/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install domain package
        working-directory: packages/chaoxing-domain
        run: npm ci

      - name: Install Windows host
        working-directory: apps/chaoxing_windows
        run: npm ci

      - name: Typecheck Windows host
        working-directory: apps/chaoxing_windows
        run: npm run typecheck

      - name: Test Windows host
        working-directory: apps/chaoxing_windows
        run: npm test

      - name: Publish C# shell and attempt Inno installer
        working-directory: apps/chaoxing_windows
        shell: pwsh
        run: ./tool/ci-windows-native.ps1

      - name: Upload Windows native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chaoxing-windows-native
          path: |
            apps/chaoxing_windows/build/windows/x64/chaoxing_windows.exe
            apps/chaoxing_windows/build/chaoxing-windows-x64-setup.exe
            apps/chaoxing_windows/build/WINDOWS-BUILD.txt
          if-no-files-found: error

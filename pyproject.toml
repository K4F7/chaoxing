[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-api-loadtest"
version = "0.1.0"
description = "A lightweight async load-testing CLI for the Anthropic Claude Messages API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Claude API Loadtest Contributors" }]
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
]

[project.scripts]
claude-loadtest = "claude_loadtest.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
